# ============================================================================
# ZBar 发布流水线：推 v* tag 触发，云端构建 Windows + macOS 双平台安装包
#
# 流程：build（3 平台并行：签名构建 → 上传产物）→ release（生成双源
# latest.json → GitHub Release → Gitee 固定 tag latest Release）
#
# 仓库 Secrets（Settings → Secrets and variables → Actions）：
#   TAURI_SIGNING_PRIVATE_KEY          更新签名私钥内容（~/.tauri/zbar-updater.key）
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD 私钥密码（生成时为空可不设置）
#   GITEE_TOKEN                        Gitee 私人令牌（勾选 projects），缺失时跳过 Gitee 源
#
# 本地发布：改好版本号提交后 `git tag v0.2.0 && git push origin v0.2.0`
# ============================================================================
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis # Windows 更新只用 NSIS，跳过 MSI 省一半时间
            artifact: dist-windows
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: ''
            artifact: dist-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: ''
            artifact: dist-macos-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: 签名构建
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          ARGS=(--target "${{ matrix.target }}")
          [[ -n "${{ matrix.bundles }}" ]] && ARGS+=(--bundles ${{ matrix.bundles }})
          npx tauri build "${ARGS[@]}"

      - name: 收集产物（安装包 + .sig 签名）
        shell: bash
        run: |
          mkdir -p out
          BASE="src-tauri/target/${{ matrix.target }}/release/bundle"
          find "$BASE/nsis" -name '*-setup.exe*' -exec cp {} out/ \; 2>/dev/null || true
          find "$BASE/dmg" -name '*.dmg' -exec cp {} out/ \; 2>/dev/null || true
          # macOS 更新包产物名固定为 <产品名>.app.tar.gz（不带架构），手动补后缀：
          # 两个 mac 架构同名会互相覆盖，且 latest.json 需按架构区分下载地址
          if [[ -d "$BASE/macos" ]]; then
            case "${{ matrix.target }}" in
              aarch64-*) SUFFIX=aarch64 ;;
              x86_64-*)  SUFFIX=x64 ;;
            esac
            for f in "$BASE/macos/"*.app.tar.gz; do
              [[ -e "$f" ]] || continue
              stem="$(basename "$f" .app.tar.gz)"
              cp "$f" "out/${stem}_${SUFFIX}.app.tar.gz"
              [[ -f "$f.sig" ]] && cp "$f.sig" "out/${stem}_${SUFFIX}.app.tar.gz.sig"
            done
          fi
          echo '--- out ---'
          ls -la out/
          [[ $(ls out | wc -l) -gt 0 ]] || { echo '未收集到任何产物'; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*
          if-no-files-found: error

  release:
    name: 发布双仓库
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: 生成双源 latest.json
        env:
          GH_REPO_NAME: codez-yydd/zai-floating-monitor
          GITEE_REPO_NAME: codezwx/zai-floating-monitor
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          GH_BASE="https://github.com/$GH_REPO_NAME/releases/download/v$VERSION"
          GITEE_BASE="https://gitee.com/$GITEE_REPO_NAME/releases/download/latest"
          python3 scripts/gen_latest.py "$GH_BASE" out/latest.json
          python3 scripts/gen_latest.py "$GITEE_BASE" out/gitee-latest.json
          cat out/latest.json

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: codez-yydd/zai-floating-monitor
        run: |
          # 重跑幂等：上次失败可能留下残缺 release，先清理（tag 保留）
          gh release view "v$VERSION" >/dev/null 2>&1 && gh release delete "v$VERSION" --yes || true
          gh release create "v$VERSION" out/* \
            --title "ZBar v$VERSION" \
            --notes "ZBar v$VERSION：Token 速率与首字延迟指标、各 Agent 当前模型显示、应用内自动更新（Windows / macOS）。首次升级需手动下载安装，此后可在应用内一键更新。" \
            --latest

      - name: 发布 Gitee 更新源（固定 tag latest）
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO_NAME: codezwx/zai-floating-monitor
        run: |
          if [[ -z "${GITEE_TOKEN:-}" ]]; then
            echo '::warning::未配置 GITEE_TOKEN secret，跳过 Gitee 更新源（配置后重跑本 job 即可补发）'
            exit 0
          fi
          API="https://gitee.com/api/v5/repos/$GITEE_REPO_NAME/releases"
          TOKEN="access_token=$GITEE_TOKEN"

          # 删除旧 latest release（tag 复用）
          OLD_ID=$(curl -sf "$API/tags/latest?$TOKEN" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2 || true)
          [[ -n "${OLD_ID:-}" ]] && curl -sf -X DELETE "$API/$OLD_ID?$TOKEN" >/dev/null && echo '已删除旧 latest release'

          # 先创建 release 拿 id，再逐个上传附件（Gitee 官方 gitee-release-cli
          # 的用法：POST /releases/{id}/attach_files；创建时传 files 参数无效）
          RESP=$(curl -sS -w '\n%{http_code}' -X POST "$API" \
            -F "$TOKEN" \
            -F 'tag_name=latest' \
            -F 'target_commitish=master' \
            -F "name=ZBar v$VERSION（应用内更新源）" \
            -F 'body=ZBar $VERSION 自动更新通道，保持最新版即可。')
          CODE=$(echo "$RESP" | tail -1)
          if [[ "$CODE" != 2* ]]; then
            echo "::error::Gitee release 创建失败 HTTP $CODE："
            echo "$RESP" | head -n -1
            exit 1
          fi
          RELEASE_ID=$(echo "$RESP" | head -n -1 | grep -o '"id": *[0-9]*' | head -1 | grep -o '[0-9]*')
          [[ -n "$RELEASE_ID" ]] || { echo '::error::未解析到 release id'; exit 1; }
          echo "Gitee release 已创建 (id=$RELEASE_ID)，开始上传附件"

          upload() { # $1=文件 $2=上传名
            curl -sS -f -X POST "$API/$RELEASE_ID/attach_files" \
              -F "access_token=$GITEE_TOKEN" \
              -F "file=@$1;filename=$2" >/dev/null
          }
          for f in out/*-setup.exe out/*-setup.exe.sig \
                   out/*aarch64*.app.tar.gz out/*aarch64*.app.tar.gz.sig \
                   out/*x64.app.tar.gz out/*x64.app.tar.gz.sig \
                   out/*.dmg; do
            [[ -f "$f" ]] || continue
            upload "$f" "$(basename "$f")" || { echo "::error::附件上传失败: $f"; exit 1; }
            echo "  已上传 $(basename "$f")"
          done
          upload out/gitee-latest.json latest.json || { echo '::error::latest.json 上传失败'; exit 1; } # Gitee 侧文件名必须是 latest.json
          echo '  已上传 latest.json'

          echo ''
          echo '发布完成，更新源：'
          echo "  https://github.com/codez-yydd/zai-floating-monitor/releases/latest/download/latest.json"
          echo "  https://gitee.com/codezwx/zai-floating-monitor/releases/download/latest/latest.json"
