<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>ZBar 用量监控</title>
<style>
/* 深色主题 · 系统字体 · 零外部资源（内网可用） */
:root {
  color-scheme: dark;
  --bg: #0f1115;
  --card: #181b22;
  --card-2: #1f232d;
  --border: #272c37;
  --text: #e7eaf0;
  --muted: #8b93a3;
  --accent: #4f8cff;
  --green: #34c77b;
  --amber: #f5b544;
  --red: #ef5350;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overscroll-behavior-y: contain; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei",
    "Segoe UI", Roboto, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.hidden { display: none !important; }
.wrap { max-width: 680px; margin: 0 auto; padding: 0 14px 32px; }
/* 加载中：内容卡区整体降透明度，结束恢复 */
.wrap > nav, .wrap > section { transition: opacity .15s; }
body.loading .wrap > nav, body.loading .wrap > section { opacity: .6; }

/* ===== 登录视图 ===== */
.login {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.login-box {
  width: 100%;
  max-width: 360px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 28px 22px;
}
.login-logo {
  width: 46px; height: 46px;
  border-radius: 12px;
  background: linear-gradient(135deg, #4f8cff, #7a5cff);
  color: #fff;
  font-weight: 700;
  font-size: 20px;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 14px;
}
.login-box h1 { font-size: 18px; text-align: center; margin-bottom: 6px; }
.login-tip { color: var(--muted); font-size: 13px; text-align: center; margin-bottom: 18px; }
.login-box input {
  width: 100%;
  background: var(--card-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-size: 15px;
  padding: 11px 12px;
  outline: none;
}
.login-box input:focus { border-color: var(--accent); }
.login-err { color: var(--red); font-size: 12px; min-height: 18px; margin: 8px 0 4px; }
.btn {
  width: 100%;
  border: none;
  border-radius: 10px;
  background: var(--accent);
  color: #fff;
  font-size: 15px;
  padding: 11px 0;
  cursor: pointer;
}
.btn:active { opacity: .85; }
.btn[disabled] { opacity: .5; cursor: default; }

/* ===== 顶栏 ===== */
.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 0 10px;
  background: var(--bg);
}
.topbar .logo {
  width: 30px; height: 30px;
  border-radius: 8px;
  background: linear-gradient(135deg, #4f8cff, #7a5cff);
  color: #fff;
  font-weight: 700; font-size: 14px;
  display: flex; align-items: center; justify-content: center;
}
.topbar h1 { font-size: 17px; flex: 1; }
.sync-time { color: var(--muted); font-size: 12px; text-align: right; }
.refresh-btn {
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  border-radius: 8px;
  font-size: 13px;
  padding: 6px 12px;
  cursor: pointer;
}
.refresh-btn.spin { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.pull-tip {
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  height: 0;
  overflow: hidden;
  transition: height .15s;
}
.pull-tip.show { height: 26px; line-height: 26px; }

.state-tip { color: var(--muted); text-align: center; padding: 32px 0; }
.error-box {
  background: #2a1b1c;
  border: 1px solid #55292b;
  border-radius: 12px;
  color: #f0a5a3;
  padding: 12px 14px;
  margin: 10px 0;
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.error-box button {
  border: none; border-radius: 8px;
  background: var(--red); color: #fff;
  padding: 6px 12px; cursor: pointer; font-size: 12px;
  flex-shrink: 0;
}

/* ===== 范围切换 tab ===== */
.range-tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 12px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.range-tab {
  flex-shrink: 0;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--muted);
  border-radius: 999px;
  font-size: 12px;
  padding: 7px 14px;
  cursor: pointer;
}
.range-tab.active {
  color: var(--text);
  border-color: var(--accent);
  background: rgba(79, 140, 255, .14);
}

/* ===== 自定义范围 ===== */
.custom-panel {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 12px 14px;
  margin-bottom: 12px;
}
.custom-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.custom-row .label { color: var(--muted); font-size: 12px; flex-shrink: 0; }
.custom-row input {
  flex: 1;
  min-width: 0;
  background: var(--card-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 13px;
  padding: 8px 10px;
  outline: none;
}
.custom-row input:focus { border-color: var(--accent); }
.custom-row input::-webkit-calendar-picker-indicator { filter: invert(.7); }
.custom-apply {
  width: 100%;
  border: none;
  border-radius: 8px;
  background: var(--accent);
  color: #fff;
  font-size: 13px;
  padding: 9px 0;
  cursor: pointer;
}
.custom-apply:active { opacity: .85; }

/* ===== 当前范围汇总卡 ===== */
.summary-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px 14px;
  text-align: center;
  margin-bottom: 12px;
}
.summary-card .tokens { font-size: 24px; font-weight: 700; }
.summary-card .req { color: var(--muted); font-size: 12px; margin-top: 4px; }
.summary-card .range-info { color: var(--muted); font-size: 11px; margin-top: 4px; }

/* ===== 通用卡片 ===== */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 12px;
}
.card h2 { font-size: 14px; margin-bottom: 12px; }
.card .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 14px 0; }

.bar-track {
  height: 8px;
  border-radius: 4px;
  /* 用半透明白而非 var(--card-2)：分组卡片底色与轨道同色会让 0% 行轨道隐形 */
  background: rgba(255, 255, 255, .07);
  overflow: hidden;
}
.bar-fill { height: 100%; border-radius: 4px; background: var(--accent); transition: width .4s; }

/* ===== 各源分组 ===== */
.source-item { margin-bottom: 14px; }
.source-item:last-child { margin-bottom: 0; }
.source-head { display: flex; justify-content: space-between; margin-bottom: 6px; }
.source-head .name { font-weight: 600; }
.source-head .val { color: var(--muted); font-size: 12px; }
.model-rows { margin-top: 8px; }
.model-row {
  display: flex;
  justify-content: space-between;
  color: var(--muted);
  font-size: 12px;
  padding: 3px 0 3px 10px;
}
.model-row .m { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 70%; }

/* ===== 额度（按 agent 分组卡片）===== */
.quota-agent {
  background: var(--card-2);
  border-radius: 10px;
  padding: 10px;
  margin-bottom: 12px;
}
.quota-agent:last-child { margin-bottom: 0; }
.quota-agent-head { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.brand-icon { width: 14px; height: 14px; display: inline-flex; flex-shrink: 0; }
.brand-icon svg { width: 100%; height: 100%; display: block; }
.quota-agent-name { font-weight: 600; font-size: 13px; }
.quota-account { margin-bottom: 12px; }
.quota-account:last-child { margin-bottom: 0; }
/* 小节标题行：flex 两端对齐（左名称、右套餐徽标） */
.quota-account-title {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  font-size: 12px;
  margin-bottom: 6px;
}
.quota-account-title .t-name {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* 套餐 / 等级徽标：小胶囊，中性底色 + 亮前景，深色主题下清晰可读 */
.quota-badge {
  flex-shrink: 0;
  padding: 1px 7px;
  border-radius: 999px;
  font-size: 11px;
  line-height: 16px;
  background: rgba(255, 255, 255, .08);
  color: var(--text);
}
.quota-item { margin-bottom: 8px; }
.quota-item:last-child { margin-bottom: 0; }
.quota-head { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
.quota-head .pct { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.quota-reset { color: var(--muted); font-size: 11px; margin-top: 3px; font-variant-numeric: tabular-nums; }
.quota-sub { color: var(--muted); font-size: 11px; margin-top: 3px; }

/* ===== 项目 Top ===== */
.proj-item { margin-bottom: 12px; }
.proj-item:last-child { margin-bottom: 0; }
.proj-head { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; gap: 10px; }
.proj-head .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proj-head .val { color: var(--muted); font-size: 12px; flex-shrink: 0; }
.proj-sub { color: var(--muted); font-size: 11px; margin-top: 3px; }

.foot { color: var(--muted); font-size: 11px; text-align: center; margin-top: 18px; }

.toast {
  position: fixed;
  left: 50%; bottom: 48px;
  transform: translateX(-50%);
  background: #2b303b;
  color: var(--text);
  border-radius: 10px;
  padding: 8px 16px;
  font-size: 13px;
  z-index: 99;
}
</style>
</head>
<body>

<!-- 登录视图：首次打开输入 view token -->
<section id="login" class="login hidden">
  <div class="login-box">
    <div class="login-logo">Z</div>
    <h1>ZBar 用量监控</h1>
    <p class="login-tip">输入服务端生成的查看令牌（VIEW_TOKEN）<br>见服务端启动日志，或向管理员索取</p>
    <input id="token-input" type="password" placeholder="访问令牌" autocomplete="off">
    <div class="login-err" id="login-err"></div>
    <button class="btn" id="btn-login">验证并进入</button>
  </div>
</section>

<!-- 主视图 -->
<main id="main" class="hidden">
  <div class="wrap">
    <header class="topbar">
      <div class="logo">Z</div>
      <h1>ZBar</h1>
      <div class="sync-time">最后同步<br><span id="last-sync">…</span></div>
      <button class="refresh-btn" id="btn-refresh">刷新</button>
    </header>
    <div class="pull-tip" id="pull-tip">下拉刷新</div>

    <nav class="range-tabs" id="range-tabs"></nav>
    <section class="custom-panel hidden" id="custom-panel">
      <div class="custom-row">
        <span class="label">开始</span>
        <input type="datetime-local" id="custom-start">
      </div>
      <div class="custom-row">
        <span class="label">结束</span>
        <input type="datetime-local" id="custom-end">
      </div>
      <button class="custom-apply" id="btn-apply-custom">应用</button>
    </section>

    <div class="state-tip" id="loading">加载中…</div>
    <div class="error-box hidden" id="error">
      <span id="error-text">加载失败</span>
      <button id="btn-retry">重试</button>
    </div>

    <section class="summary-card" id="summary-card">
      <div class="tokens">—</div>
      <div class="req">…</div>
      <div class="range-info"></div>
    </section>
    <section class="card" id="sources-card"><h2>各来源分布</h2><div class="body"></div></section>
    <section class="card" id="quota-card"><h2>订阅额度</h2><div class="body"></div></section>
    <section class="card" id="projects-card"><h2>项目 Top10</h2><div class="body"></div></section>

    <footer class="foot">每 60 秒自动刷新 · 仅统计 Token 用量，不显示花费</footer>
  </div>
</main>

<div class="toast hidden" id="toast"></div>

<script>
"use strict";

var TOKEN_KEY = "zbar_view_token";
var REFRESH_MS = 60000;

var token = localStorage.getItem(TOKEN_KEY) || "";
// /overview 中与时间范围无关的部分（quota_latest / devices / last_synced_at）
var data = null;
// 当前范围 /usage 结果（overall / by_model）
var usageData = null;
// 当前范围 /projects 结果（数组）
var projectsData = null;
var timer = null;
var loading = false;

// ===== 工具 =====

function $(id) { return document.getElementById(id); }

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

// Token 数格式化：中文单位（万 / 亿）
function fmtTokens(n) {
  n = Number(n) || 0;
  if (n >= 1e8) return (n / 1e8).toFixed(2) + " 亿";
  if (n >= 1e4) return (n / 1e4).toFixed(1) + " 万";
  return String(n);
}

function fmtInt(n) {
  return (Number(n) || 0).toLocaleString("zh-CN");
}

// 相对时间：「x 分钟前」
function relTime(ms) {
  if (!ms) return "从未";
  var diff = Date.now() - Number(ms);
  if (diff < 60e3) return "刚刚";
  if (diff < 3600e3) return Math.floor(diff / 60e3) + " 分钟前";
  if (diff < 86400e3) return Math.floor(diff / 3600e3) + " 小时前";
  return Math.floor(diff / 86400e3) + " 天前";
}

var SOURCE_NAMES = { zcode: "ZCode", codex: "Codex", claude: "Claude", cursor: "Cursor" };
function sourceName(s) { return SOURCE_NAMES[s] || s || "未知来源"; }

var WINDOW_NAMES = { hour5: "5 小时", weekly: "每周", cursor_auto: "Auto", cursor_api: "API" };
function windowName(k) { return WINDOW_NAMES[k] || k; }

function projectName(p) {
  if (p.key === "__unknown__") return p.display || "未知项目";
  return p.display || p.key || "未知项目";
}

// ============================================================
// 额度剩余渐变色：进度条统一按「剩余百分比」着色（算法与桌面端
// src/widgets.tsx 的 REMAINING_STOPS / remainingHsl 一致，勿单改一处）。
// 分档语义：剩余 >80% 绿、30~80% 黄、<30% 红；段内随剩余连续渐变，
// 剩余越低颜色越深，边界色连续无跳变。
// ============================================================

// 插值锚点：[剩余%, 色相, 饱和度%, 亮度%]。色相用 -2 等价 358，避免跨 360 插值走反方向；
// 饱和度控制在 56~70，与界面低饱和深色风格协调，避免高饱和纯色扎眼
var REMAINING_STOPS = [
  [0, -2, 66, 41],    // 砖红（额度耗尽）
  [30, 24, 70, 50],   // 柔橙（红/黄边界）
  [80, 48, 68, 46],   // 暖黄（黄/绿边界，色相偏暖降低荧光感）
  [100, 152, 56, 40]  // 灰绿（额度充裕）
];

// 剩余百分比 → 基色 HSL（分段线性插值），返回 [h, s, l]
function remainingHsl(remaining) {
  var r = Math.min(Math.max(remaining, 0), 100);
  for (var i = 0; i < REMAINING_STOPS.length - 1; i++) {
    var a = REMAINING_STOPS[i], b = REMAINING_STOPS[i + 1];
    if (r <= b[0]) {
      var t = (r - a[0]) / (b[0] - a[0]);
      // 色相取模 360 防负（锚点 -2 落在本段时会插出小负数，等价 358 方向）
      var h = (((a[1] + (b[1] - a[1]) * t) % 360) + 360) % 360;
      return [h, a[2] + (b[2] - a[2]) * t, a[3] + (b[3] - a[3]) * t];
    }
  }
  var last = REMAINING_STOPS[REMAINING_STOPS.length - 1];
  return [last[1], last[2], last[3]];
}

// HSL → 字符串（数值四舍五入到 1 位小数，内联样式输出干净）
function hslStr(h, s, l) {
  function f(n) { return Math.round(n * 10) / 10; }
  return "hsl(" + f(h) + ", " + f(s) + "%, " + f(l) + "%)";
}

// 剩余百分比 → 进度条填充渐变（左深右浅；右端仅提亮 6 个点、封顶 52，保留立体感不发荧光）
function remainingGradient(remaining) {
  var c = remainingHsl(remaining);
  return "linear-gradient(90deg, " + hslStr(c[0], c[1], c[2]) + ", " +
    hslStr(c[0], c[1], Math.min(c[2] + 6, 52)) + ")";
}

// 剩余百分比 → 数字文字颜色（同基色但压暗 10 个亮度点、下限 28：小号数字需要更高对比度）
function remainingTextColor(remaining) {
  var c = remainingHsl(remaining);
  return hslStr(c[0], c[1], Math.max(c[2] - 10, 28));
}

function showToast(msg) {
  var t = $("toast");
  t.textContent = msg;
  t.classList.remove("hidden");
  clearTimeout(showToast._h);
  showToast._h = setTimeout(function () { t.classList.add("hidden"); }, 2200);
}

// ===== 品牌图标（path 数据与桌面端 src/BrandIcon.tsx 一致，勿手改坐标）=====

var BRAND_ICONS = {
  // Z.ai：外壳 currentColor + 白色 Z 字
  zai: '<svg viewBox="0 0 30 30" fill="none" aria-hidden="true">' +
    '<path fill="currentColor" d="M24.51 28.51H5.49c-2.21 0-4-1.79-4-4V5.49c0-2.21 1.79-4 4-4h19.03c2.21 0 4 1.79 4 4v19.03c-.01 2.2-1.8 3.99-4.01 3.99Z"/>' +
    '<path fill="#fff" d="m15.47 7.1-1.3 1.85c-.2.29-.54.47-.9.47h-7.1V7.09c-.01.01 9.3.01 9.3.01Zm8.83 0-11.16 15.81H5.7L16.86 7.1h7.44Zm-9.77 15.81 1.31-1.86c.2-.29.54-.47.9-.47h7.09v2.33h-9.3Z"/>' +
    "</svg>",

var BRAND_COLORS = { zai: "#38bdf8", codex: "#34d399", claude: "#fb923c", cursor: "#a78bfa" };

// ===== 重置时间（复刻桌面端 formatCountdownCore / formatResetStamp）=====

// 毫秒差 → 倒计时：<1m / Xm / Xh Ym（分钟不补零）/ Xd Yh
function fmtCountdown(ms) {
  var totalMin = Math.floor(ms / 60000);
  if (totalMin < 1) return "<1m";
  var days = Math.floor(totalMin / 1440);
  var hours = Math.floor((totalMin % 1440) / 60);
  var mins = totalMin % 60;
  if (days > 0) return days + "d " + hours + "h";
  if (hours > 0) return hours + "h " + mins + "m";
  return mins + "m";
}

// 时间戳 → "MM-DD HH:mm"（本地时区，月日时分两位补零）
function fmtResetStamp(ms) {
  var d = new Date(ms);
  function p(n) { return (n < 10 ? "0" : "") + n; }
  return p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}

// 重置信息片段：↻ 倒计时 · MM-DD HH:mm（reset 为 null/0 或已过期时不显示）。
// 倒计时元素带 data-reset，由全局每秒定时器只更新文本。
function resetInfo(resetMs) {
  resetMs = Number(resetMs);
  if (!resetMs || resetMs <= Date.now()) return "";
  return '<div class="quota-reset">↻ <span data-reset="' + resetMs + '">' +
    esc(fmtCountdown(resetMs - Date.now())) + "</span> · " + fmtResetStamp(resetMs) + "</div>";
}

// 倒计时每秒跳动：只改 [data-reset] 文本，不整卡重渲染（避免打断触摸交互）
function startCountdownTicker() {
  setInterval(function () {
    var els = document.querySelectorAll("[data-reset]");
    var now = Date.now();
    for (var i = 0; i < els.length; i++) {
      var left = Number(els[i].getAttribute("data-reset")) - now;
      if (left <= 0) {
        // 已到期：隐藏整条重置信息，避免出现负数倒计时
        var tip = els[i].closest(".quota-reset");
        if (tip) tip.style.display = "none";
        continue;
      }
      els[i].textContent = fmtCountdown(left);
    }
  }, 1000);
}

// ===== 时间范围 =====

var RANGE_KEYS = ["today", "24h", "7d", "30d", "custom"];
var RANGE_LABELS = { today: "今日", "24h": "24h", "7d": "近 7 天", "30d": "近 30 天", custom: "自定义" };
var currentRange = "today";
// 自定义范围应用后的 [start, end] 毫秒（未应用为 null，切到自定义 tab 只展开面板）
var customRange = null;

// 当前所选范围 → [start, end] 毫秒（本地时区计算；自定义为止点可含未来时刻）
function rangeMs() {
  var now = Date.now();
  var day = 86400000;
  if (currentRange === "today") {
    var d = new Date();
    return [new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(), now];
  }
  if (currentRange === "24h") return [now - day, now];
  if (currentRange === "7d") return [now - 7 * day, now];
  if (currentRange === "30d") return [now - 30 * day, now];
  return customRange || [now - 30 * day, now]; // 自定义未应用时的兜底，正常不触达
}

function renderTabs() {
  $("range-tabs").innerHTML = RANGE_KEYS.map(function (k) {
    return '<button class="range-tab' + (k === currentRange ? " active" : "") +
      '" data-range="' + k + '">' + RANGE_LABELS[k] + "</button>";
  }).join("");
}

// Date → datetime-local 输入值格式（YYYY-MM-DDTHH:mm，本地时区）
function toLocalInput(d) {
  function p(n) { return (n < 10 ? "0" : "") + n; }
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) +
    "T" + p(d.getHours()) + ":" + p(d.getMinutes());
}

// 自定义输入默认值：起 = 29 天前本地 0 点，止 = 今天 23:59
function initCustomInputs() {
  var d = new Date();
  var start = new Date(d.getFullYear(), d.getMonth(), d.getDate() - 29);
  var end = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 23, 59);
  $("custom-start").value = toLocalInput(start);
  $("custom-end").value = toLocalInput(end);
}

// 应用自定义范围：起 ≥ 止时提示并不应用；成功后才切换到自定义范围并加载数据
function applyCustom() {
  var sv = $("custom-start").value;
  var ev = $("custom-end").value;
  if (!sv || !ev) { showToast("请选择起止时间"); return; }
  var start = new Date(sv).getTime();
  var end = new Date(ev).getTime();
  if (!(start < end)) { showToast("开始时间需早于结束时间"); return; }
  customRange = [start, end];
  $("custom-panel").classList.add("hidden");
  if (currentRange !== "custom") {
    currentRange = "custom";
    renderTabs();
  }
  loadData();
}

// 范围 tab 切换（事件委托，按钮为动态渲染）
function onRangeTabClick(e) {
  var btn = e.target.closest("button[data-range]");
  if (!btn) return;
  var r = btn.getAttribute("data-range");
  if (r === "custom") {
    // 首次点击：只展开面板，范围与高亮保持上一档，等「应用」再切换；
    // 已是自定义时再点 = 开合切换面板，不重复加载数据
    if (currentRange === "custom") {
      $("custom-panel").classList.toggle("hidden");
      return;
    }
    $("custom-panel").classList.remove("hidden");
    return;
  }
  $("custom-panel").classList.add("hidden");
  if (r === currentRange) return;
  currentRange = r;
  renderTabs();
  loadData();
}

// ===== API =====

function api(path) {
  return fetch(path, { headers: { "Authorization": "Bearer " + token } }).then(function (res) {
    if (res.status === 401) {
      logout();
      throw new Error("令牌已失效，请重新输入");
    }
    if (!res.ok) throw new Error("服务端返回 " + res.status);
    return res.json();
  });
}

// ===== 登录 / 登出 =====

function logout() {
  token = "";
  localStorage.removeItem(TOKEN_KEY);
  overviewCache = null;
  if (timer) { clearInterval(timer); timer = null; }
  $("main").classList.add("hidden");
  $("login").classList.remove("hidden");
  $("token-input").value = "";
  $("login-err").textContent = "";
}

function tryLogin(input) {
  var btn = $("btn-login");
  btn.disabled = true;
  $("login-err").textContent = "";
  fetch("/view/check", { headers: { "Authorization": "Bearer " + input } }).then(function (res) {
    if (res.ok) {
      token = input;
      localStorage.setItem(TOKEN_KEY, input);
      $("login").classList.add("hidden");
      $("main").classList.remove("hidden");
      startAutoRefresh();
      loadData();
    } else {
      $("login-err").textContent = res.status === 401 ? "令牌不正确，请检查后重试" : "服务端异常（" + res.status + "）";
    }
  }).catch(function () {
    $("login-err").textContent = "无法连接服务端，请检查地址与网络";
  }).finally(function () {
    btn.disabled = false;
  });
}

// ===== 数据加载与渲染 =====

// /overview 结果缓存：额度快照与时间范围无关，短时间内复用，避免重复拉取
var overviewCache = null;
var OVERVIEW_CACHE_MS = 45000;

function fetchOverview() {
  if (overviewCache && Date.now() - overviewCache.at < OVERVIEW_CACHE_MS) {
    return Promise.resolve(overviewCache.data);
  }
  return api("/overview").then(function (d) {
    overviewCache = { at: Date.now(), data: d };
    return d;
  });
}

// 加载进行中又有新的范围加载请求：当前响应作废后自动补载一次
var reloadNeeded = false;

// 并行拉取：当前范围用量（/usage）+ 项目聚合（/projects）+ 额度快照（/overview，
// 带 45s 缓存）。opt.toast 为真时加载成功后提示（手动刷新用，失败走错误框不提示）。
function loadData(opt) {
  if (loading) { reloadNeeded = true; return; }
  loading = true;
  $("btn-refresh").classList.add("spin");
  document.body.classList.add("loading");
  var range = rangeMs();
  // 记录发起时的范围快照：响应回来若范围已切换则丢弃，避免渲染旧范围数据
  var reqRange = currentRange;
  var reqCustom = customRange;
  Promise.all([
    api("/usage?from_ms=" + range[0] + "&to_ms=" + range[1]),
    api("/projects?from=" + range[0] + "&to=" + range[1]),
    fetchOverview()
  ]).then(function (res) {
    if (currentRange !== reqRange || customRange !== reqCustom) return;
    usageData = res[0];
    projectsData = res[1];
    data = {
      quota_latest: res[2].quota_latest,
      devices: res[2].devices,
      last_synced_at: res[2].last_synced_at
    };
    $("loading").classList.add("hidden");
    $("error").classList.add("hidden");
    render();
    if (opt && opt.toast) showToast("已刷新");
  }).catch(function (e) {
    if (currentRange !== reqRange || customRange !== reqCustom) return;
    if (token) {
      $("loading").classList.add("hidden");
      $("error-text").textContent = "加载失败：" + e.message;
      $("error").classList.remove("hidden");
    }
  }).finally(function () {
    loading = false;
    $("btn-refresh").classList.remove("spin");
    document.body.classList.remove("loading");
    if (reloadNeeded) {
      reloadNeeded = false;
      loadData(opt);
    }
  });
}

function render() {
  if (!data) return;
  $("last-sync").textContent = relTime(data.last_synced_at);
  renderSummary();
  renderSources();
  renderQuota();
  renderProjects();
}

// 当前范围汇总卡：Token 总量 + 请求数 + 范围说明
function renderSummary() {
  var o = (usageData && usageData.overall) || {};
  var info = RANGE_LABELS[currentRange] || "";
  if (currentRange === "custom" && customRange) {
    // 自定义：显示起止时间点（MM-DD HH:mm ~ MM-DD HH:mm）
    info = fmtResetStamp(customRange[0]) + " ~ " + fmtResetStamp(customRange[1]);
  }
  $("summary-card").innerHTML =
    '<div class="tokens">' + fmtTokens(o.total_tokens) + "</div>" +
    '<div class="req">' + fmtInt(o.requests) + " 次请求</div>" +
    '<div class="range-info">' + esc(info) + "</div>";
}

// 各来源分布（当前范围，由 by_model 按 source 聚合，与 overall 口径一致）
function renderSources() {
  var body = $("sources-card").querySelector(".body");
  var byModel = (usageData && usageData.by_model) || [];
  if (!byModel.length) {
    body.innerHTML = '<div class="empty">暂无数据，等待设备同步</div>';
    return;
  }
  var bySource = {};
  byModel.forEach(function (m) {
    var s = bySource[m.source];
    if (!s) s = bySource[m.source] = { tokens: 0, requests: 0, models: [] };
    s.tokens += Number(m.total_tokens) || 0;
    s.requests += Number(m.requests) || 0;
    s.models.push(m);
  });
  var sources = Object.keys(bySource).map(function (k) { return bySource[k]; });
  var total = sources.reduce(function (a, s) { return a + s.tokens; }, 0);
  var html = "";
  Object.keys(bySource).sort(function (a, b) { return bySource[b].tokens - bySource[a].tokens; })
    .forEach(function (k) {
      var s = bySource[k];
      var pct = total > 0 ? Math.round(s.tokens / total * 100) : 0;
      html += '<div class="source-item">' +
        '<div class="source-head"><span class="name">' + esc(sourceName(k)) + "</span>" +
        "<span>" + fmtTokens(s.tokens) + " · " + fmtInt(s.requests) + " 次</span></div>" +
        '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>' +
        '<div class="model-rows">' +
        s.models.sort(function (a, b) { return (b.total_tokens || 0) - (a.total_tokens || 0); })
          .slice(0, 3).map(function (m) {
            return '<div class="model-row"><span class="m">' + esc(m.model_id || "未知模型") + "</span>" +
              "<span>" + fmtTokens(m.total_tokens) + "</span></div>";
          }).join("") +
        "</div></div>";
    });
  body.innerHTML = html;
}

// 套餐等级 → 展示标签（与桌面端 src/format.ts 的 LEVEL_LABEL 一致，未知等级原样返回）
var LEVEL_LABELS = { lite: "Lite", pro: "Pro", max: "Max", ultra: "Ultra" };
function levelLabel(level) { return LEVEL_LABELS[level] || level; }

// 订阅套餐 → 徽标文本：首字母大写（如 plus → Plus）
function planLabel(p) {
  p = String(p);
  return p ? p.charAt(0).toUpperCase() + p.slice(1) : p;
}

// 账号标识脱敏：≥12 位显示前 4 + … + 后 4（完整值由调用方放 title），短值原样
function maskAccount(a) {
  a = String(a);
  return a.length >= 12 ? a.slice(0, 4) + "…" + a.slice(-4) : a;
}

// agent 分组块头：品牌 logo（品牌色）+ agent 名（品牌色）
function agentBlock(src, label, inner) {
  var color = BRAND_COLORS[src] || "#8b93a3";
  return '<div class="quota-agent">' +
    '<div class="quota-agent-head">' +
    '<span class="brand-icon" style="color:' + color + '">' + (BRAND_ICONS[src] || "") + "</span>" +
    '<span class="quota-agent-name" style="color:' + color + '">' + esc(label) + "</span>" +
    "</div>" + inner + "</div>";
}

// 额度窗口行：窗口名 + 剩余百分比 + 进度条（+ 重置信息 / 次数小字）。
// 入参为「已用百分比」，展示统一换算为「剩余百分比」口径（与桌面端面板一致）
function quotaRow(windowLabel, usedPct, resetMs, subText) {
  // windowLabel 可能来自服务端的未知 window key（windowName 原样返回），
  // subText 含设备名等客户端数据，统一 esc() 后再拼入 innerHTML 防止 XSS。
  // 已用% 统一在此收敛（null/undefined/越界 → 0..100），剩余 = 100 - 已用，
  // Z.ai 与 agent 侧调用都不会渲染出 NaN。
  var used = Math.min(100, Math.max(0, Number(usedPct) || 0));
  var remaining = 100 - used;
  return '<div class="quota-item">' +
    '<div class="quota-head"><span>' + esc(windowLabel) + "</span>" +
    '<span class="pct" style="color:' + remainingTextColor(remaining) + '">剩余 ' + Math.round(remaining) + "%</span></div>" +
    '<div class="bar-track"><div class="bar-fill" style="width:' + remaining + "%;background:" + remainingGradient(remaining) + '"></div></div>' +
    resetInfo(resetMs) +
    (subText ? '<div class="quota-sub">' + esc(subText) + "</div>" : "") +
    "</div>";
}

// 订阅额度：按 agent 分组卡片（品牌 logo + 每账号/订阅小节 + 窗口进度条 + 重置倒计时）
function renderQuota() {
  var body = $("quota-card").querySelector(".body");
  var q = (data && data.quota_latest) || {};
  // /overview 的 devices 仅用于把 device_id 映射为设备名
  var devNames = {};
  ((data && data.devices) || []).forEach(function (d) { devNames[d.device_id] = d.device_name; });
  var html = "";

  // Z.ai：zai_accounts 每元素一条账号最新快照，每账号一小节。
  // 旧版客户端（无账号指纹）上报的快照 account 为空：当数组中同时存在带 account
  // 的条目时，这类旧快照会与真实账号重复，不再渲染小节，改为在分组末尾追加一行
  // 弱化提示；若全部条目都无 account（用户还没有任何指纹数据），保持现状全量渲染。
  var zaiAccounts = q.zai_accounts || [];
  if (zaiAccounts.length) {
    var withAccount = zaiAccounts.filter(function (z) { return z.account; });
    var noAccount = zaiAccounts.filter(function (z) { return !z.account; });
    var renderAccounts = (withAccount.length && noAccount.length) ? withAccount : zaiAccounts;
    var zaiInner = "";
    renderAccounts.forEach(function (z, i) {
      var inner = "";
      // 小节标题（flex 两端对齐：左名称、右等级徽标）。
      // 名称优先级：account（≥12 位脱敏，完整值放 title）→ 设备名 → 「账号 N」
      var zName, zTitle = null;
      if (z.account) {
        zName = "账号 " + maskAccount(z.account);
        zTitle = String(z.account);
      } else if (devNames[z.device_id]) {
        zName = "设备 " + devNames[z.device_id];
      } else {
        zName = "账号 " + (i + 1);
      }
      inner += '<div class="quota-account-title">' +
        '<span class="t-name"' + (zTitle ? ' title="' + esc(zTitle) + '"' : "") + ">" + esc(zName) + "</span>" +
        (z.level ? '<span class="quota-badge">' + esc(levelLabel(String(z.level))) + "</span>" : "") +
        "</div>";
      inner += quotaRow("每周额度", z.weekly_pct, z.weekly_reset, null);
      inner += quotaRow("5 小时额度", z.hour5_pct, null, null);
      // 无 MCP 额度的账号 mcp_pct 为 0 且 mcp_used/mcp_total 均为 null，仅在有任一存在证据时才渲染整行（对齐桌面端 QuotaPanel.tsx 的存在性判断）
      var hasMcp = z.mcp_pct > 0 || typeof z.mcp_used === "number" || typeof z.mcp_total === "number";
      if (hasMcp) {
        // MCP 行附绝对次数小字（服务端为数字时）
        var mcpSub = null;
        if (typeof z.mcp_used === "number" && typeof z.mcp_total === "number") {
          mcpSub = "已用 " + fmtInt(z.mcp_used) + " / 总量 " + fmtInt(z.mcp_total);
        }
        inner += quotaRow("MCP 额度", z.mcp_pct, null, mcpSub);
      }
      zaiInner += '<div class="quota-account">' + inner + "</div>";
    });
    // 未归属账号的旧版快照：合并为一行弱化提示（小号灰字 + 顶部细分隔线）。
    // 设备名来自客户端数据，需 esc() 后再拼入；多台时只报数量，不含动态字符串。
    if (withAccount.length && noAccount.length) {
      var staleName;
      if (noAccount.length === 1) {
        var onlyDev = devNames[noAccount[0].device_id];
        staleName = onlyDev ? esc(onlyDev) : "1 台设备";
      } else {
        staleName = noAccount.length + " 台设备";
      }
      zaiInner += '<div style="margin-top:6px;padding-top:6px;border-top:1px solid var(--border);color:var(--muted);font-size:11px">' +
        "另有 " + staleName + " 的旧版客户端快照未归属账号，升级该设备客户端后自动合并</div>";
    }
    html += agentBlock("zai", "Z.ai", zaiInner);
  }

  // Agent 订阅：quota_latest.agent[source] 每元素一条订阅快照，每条一小节
  var agent = q.agent || {};
  var order = ["codex", "claude", "cursor"];
  Object.keys(agent).forEach(function (k) {
    if (order.indexOf(k) < 0) order.push(k); // 未知来源兜底排在后面
  });
  order.forEach(function (src) {
    var snaps = agent[src] || [];
    var inner = "";
    snaps.forEach(function (sn) {
      var rows = "";
      (sn.windows || []).forEach(function (w) {
        // used_pct 为已用%，越界收敛统一在 quotaRow 内完成
        rows += quotaRow(windowName(w.key), w.used_pct, w.reset_at, null);
      });
      if (!rows) return;
      // 小节标题：仅设备名（plan_type 移入右侧徽标，首字母大写）。
      // 单订阅且无设备名且无 plan_type 时整行省略，直接出窗口行；
      // 有 plan_type 则渲染仅含徽标的标题行（t-name 空占位，徽标靠右）；
      // 名称与徽标都为空的标题行无意义，同样不渲染
      var devName = sn.device_id ? devNames[sn.device_id] : null;
      var badge = sn.plan_type
        ? '<span class="quota-badge">' + esc(planLabel(sn.plan_type)) + "</span>"
        : "";
      if (snaps.length === 1 && !devName && !sn.plan_type) {
        inner += '<div class="quota-account">' + rows + "</div>";
      } else if (devName || badge) {
        inner += '<div class="quota-account">' +
          '<div class="quota-account-title"><span class="t-name">' + (devName ? esc(devName) : "") + "</span>" + badge + "</div>" +
          rows + "</div>";
      } else {
        inner += '<div class="quota-account">' + rows + "</div>";
      }
    });
    if (inner) html += agentBlock(src, sourceName(src), inner);
  });

  body.innerHTML = html || '<div class="empty">暂无额度快照</div>';
}

// 项目 Top10（当前范围，横条形；历史无项目维度的 __unknown__ 分组不展示）
function renderProjects() {
  var body = $("projects-card").querySelector(".body");
  var list = (projectsData || []).filter(function (p) { return p.key !== "__unknown__"; });
  if (!list.length) {
    body.innerHTML = '<div class="empty">暂无项目数据（服务端与客户端升级后，新用量将按项目归集）</div>';
    return;
  }
  var max = list[0].total_tokens || 1;
  body.innerHTML = list.slice(0, 10).map(function (p) {
    var pct = Math.round((p.total_tokens || 0) / (max || 1) * 100);
    var sessions = p.by_source.reduce(function (a, s) { return Math.max(a, Number(s.sessions) || 0); }, 0);
    return '<div class="proj-item">' +
      '<div class="proj-head"><span class="name">' + esc(projectName(p)) + "</span>" +
      "<span>" + fmtTokens(p.total_tokens) + "</span></div>" +
      '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>' +
      '<div class="proj-sub">' + fmtInt(p.requests) + " 次请求" +
      (sessions > 0 ? " · " + fmtInt(sessions) + " 个会话" : "") +
      "</div></div>";
  }).join("");
}

// ===== 启动 / 刷新 =====

function startAutoRefresh() {
  if (timer) clearInterval(timer);
  timer = setInterval(function () {
    if (!document.hidden) loadData();
  }, REFRESH_MS);
}

function bindEvents() {
  $("btn-login").addEventListener("click", function () {
    var v = $("token-input").value.trim();
    if (!v) { $("login-err").textContent = "请输入访问令牌"; return; }
    tryLogin(v);
  });
  $("token-input").addEventListener("keydown", function (e) {
    if (e.key === "Enter") $("btn-login").click();
  });
  $("btn-refresh").addEventListener("click", function () {
    loadData({ toast: true });
  });
  $("btn-retry").addEventListener("click", loadData);
  $("range-tabs").addEventListener("click", onRangeTabClick);
  $("btn-apply-custom").addEventListener("click", applyCustom);

  // 简单下拉刷新：顶部继续下拉超过 64px 触发
  var startY = 0, pulling = false;
  document.addEventListener("touchstart", function (e) {
    if (!data) return;
    startY = e.touches[0].clientY;
    pulling = window.scrollY <= 0;
  }, { passive: true });
  document.addEventListener("touchmove", function (e) {
    if (!pulling) return;
    var dist = e.touches[0].clientY - startY;
    $("pull-tip").textContent = dist > 64 ? "松开刷新" : "下拉刷新";
    $("pull-tip").classList.toggle("show", dist > 24 && window.scrollY <= 0);
  }, { passive: true });
  document.addEventListener("touchend", function (e) {
    if (!pulling) return;
    var dist = (e.changedTouches[0] || {}).clientY - startY;
    $("pull-tip").classList.remove("show");
    if (dist > 64 && window.scrollY <= 0) loadData();
    pulling = false;
  });
}

function init() {
  bindEvents();
  renderTabs();
  initCustomInputs();
  startCountdownTicker();
  if (token) {
    // 本地已有 token：先校验再进入，401 时 logout 回登录页
    fetch("/view/check", { headers: { "Authorization": "Bearer " + token } }).then(function (res) {
      if (res.ok) {
        $("main").classList.remove("hidden");
        startAutoRefresh();
        loadData();
      } else {
        logout();
      }
    }).catch(function () {
      $("login-err").textContent = "无法连接服务端，请检查地址与网络";
      $("login").classList.remove("hidden");
    });
  } else {
    $("login").classList.remove("hidden");
  }
}

init();
</script>
